id           = "bennypowers/nut-status"
name         = "NUT UPS Status"
version      = "2.1.0"
plugin_api   = 3
author       = "bennypowers"
license      = "GPL-3.0"
icon         = "battery"
description  = "Bar widget showing UPS battery status from Network UPS Tools (NUT)"
tags         = ["ups", "battery", "power", "nut"]
dependencies = ["nut"]

[[setting]]
key             = "upsName"
type            = "string"
label_key       = "settings.ups_name.label"
description_key = "settings.ups_name.description"
default         = ""

[[setting]]
key             = "updateInterval"
type            = "int"
label_key       = "settings.update_interval.label"
description_key = "settings.update_interval.description"
default         = 5000
min             = 1000
max             = 60000

[[setting]]
key             = "showPowerDraw"
type            = "bool"
label_key       = "settings.show_power_draw.label"
description_key = "settings.show_power_draw.description"
default         = true

[[setting]]
key             = "showBatteryOnlyOnBattery"
type            = "bool"
label_key       = "settings.show_battery_only_on_battery.label"
description_key = "settings.show_battery_only_on_battery.description"
default         = true

[[setting]]
key             = "batteryColor"
type            = "select"
label_key       = "settings.battery_color.label"
description_key = "settings.battery_color.description"
default         = "error"
options         = [
  { value = "auto",     label_key = "settings.battery_color.options.auto" },
  { value = "tertiary", label_key = "settings.battery_color.options.tertiary" },
  { value = "warning",  label_key = "settings.battery_color.options.warning" },
  { value = "error",    label_key = "settings.battery_color.options.error" },
  { value = "primary",  label_key = "settings.battery_color.options.primary" },
  { value = "onsurface", label_key = "settings.battery_color.options.onsurface" },
]

[[setting]]
key             = "powerFactor"
type            = "double"
label_key       = "settings.power_factor.label"
description_key = "settings.power_factor.description"
default         = 0.6
min             = 0.1
max             = 1.0

[[widget]]
id    = "status"
entry = "widget.luau"

[[panel]]
id        = "details"
entry     = "panel.luau"
width     = 350
height    = 480
placement = "attached"
