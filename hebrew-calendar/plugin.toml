id           = "bennypowers/hebrew-calendar"
name         = "Hebrew Calendar"
version      = "2.1.0"
plugin_api   = 3
author       = "bennypowers"
license      = "GPL-3.0"
icon         = "calendar"
description  = "Display current Hebrew date in the bar with full calendar panel"
tags         = ["hebrew", "calendar", "jewish", "zmanim", "shabbat"]
dependencies = ["hebcal"]

[[setting]]
key             = "template"
type            = "string"
label_key       = "settings.template.label"
description_key = "settings.template.description"
default         = "{day} {month}"

[[setting]]
key             = "city"
type            = "string"
label_key       = "settings.city.label"
description_key = "settings.city.description"
default         = "Jerusalem"

[[setting]]
key             = "israeli"
type            = "bool"
label_key       = "settings.israeli.label"
description_key = "settings.israeli.description"
default         = true

[[setting]]
key             = "language"
type            = "select"
label_key       = "settings.language.label"
description_key = "settings.language.description"
default         = "he-x-NoNikud"
options         = [
  { value = "he-x-NoNikud", label_key = "settings.language.options.he_no_nikud" },
  { value = "he",           label_key = "settings.language.options.he" },
  { value = "en",           label_key = "settings.language.options.en" },
  { value = "ashkenazi",    label_key = "settings.language.options.ashkenazi" },
]

[[widget]]
id    = "date"
entry = "widget.luau"

[[panel]]
id        = "calendar"
entry     = "panel.luau"
width     = 420
height    = 900
placement = "attached"
