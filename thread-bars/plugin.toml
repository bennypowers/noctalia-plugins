id           = "bennypowers/thread-bars"
name         = "CPU Thread Bars"
version      = "2.1.0"
plugin_api   = 32
author       = "bennypowers"
license      = "GPL-3.0"
icon         = "cpu"
description  = "Per-core CPU load bars with a per-core history panel"
tags         = ["cpu", "sysmon", "monitor", "system"]

[[setting]]
key             = "updateInterval"
type            = "int"
label_key       = "settings.update_interval.label"
description_key = "settings.update_interval.description"
default         = 1000
min             = 500
max             = 10000

[[setting]]
key             = "highlightColor"
type            = "select"
label_key       = "settings.highlight_color.label"
description_key = "settings.highlight_color.description"
default         = "error"
options         = [
  { value = "error",     label_key = "settings.highlight_color.options.error" },
  { value = "tertiary",  label_key = "settings.highlight_color.options.tertiary" },
  { value = "secondary", label_key = "settings.highlight_color.options.secondary" },
  { value = "primary",   label_key = "settings.highlight_color.options.primary" },
]

[[service]]
id    = "sampler"
entry = "service.luau"

[[widget]]
id    = "cores"
entry = "widget.luau"

[[panel]]
id        = "details"
entry     = "panel.luau"
width     = 560
height    = 700
placement = "attached"
